<!DOCTYPE html>
<html lang="utf8">
<head>
  <title>Jelly</title>
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1, maximum-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.23.0/dist/cytoscape.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/layout-base@2.0.1/layout-base.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cose-base@2.2.0/cose-base.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/webcola@3.4.0/WebCola/cola.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape-cola@2.5.1/cytoscape-cola.min.js"></script>
  <!-- ELK hierarchy layout (layered/Sugiyama) + orthogonal edge routing.
       cytoscape-elk's UMD takes elkjs from the global `ELK`, so load elkjs first. -->
  <script src="https://cdn.jsdelivr.net/npm/elkjs@0.9.3/lib/elk.bundled.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape-elk@2.3.0/dist/cytoscape-elk.min.js"></script>
  <!-- Extra dependencies for fcose layout
  <script src="https://unpkg.com/layout-base/layout-base.js"></script>
  <script src="https://unpkg.com/cose-base/cose-base.js"></script>
  <script src="https://unpkg.com/cytoscape-fcose/cytoscape-fcose.js"></script>
  -->
  <script src="https://cdn.jsdelivr.net/npm/cytoscape-expand-collapse@4.1.0/cytoscape-expand-collapse.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cytoscape-panzoom@2.5.3/cytoscape.js-panzoom.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.3/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape-panzoom@2.5.3/cytoscape-panzoom.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      overflow: hidden;
    }
    #cy {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      right: 0;
      z-index: 900;
    }
    #info {
      position: absolute;
      bottom: 20px;
      left: 10px;
      z-index: 800;
      opacity: 0.8;
      font-size: 15px;
    }
    #control {
      position: absolute;
      top: 20px;
      right: 20px;
      text-align: right;
      max-width: calc(100% - 250px);
    }
    .group {
      background: rgba(255, 255, 255, .7);
      padding: 2px 4px 2px 4px;
      text-align: left;
      display: inline-block;
      z-index: 999;
      position: relative;
    }
    #fields {
      z-index: 999;
      position: relative;
    }
    #fields label {
      background: rgba(255, 255, 255, .7);
      padding: 5px;
    }
    #dataset {
      position: absolute;
      top: 50px;
      left: 10px;
      z-index: 999;
    }
    #msg {
      position: absolute;
      margin-top: 10px;
      bottom: 20px;
      right: 20px;
      z-index: 999;
      background: rgba(255, 255, 255, .7);
      padding: 4px;
    }
    /* Off-screen neighbour bubbles. The layer itself must not swallow canvas drags
       (panzoom), so only the bubbles are clickable. z-index sits above #cy (900) and
       below the control panels (999), so the panels stay on top and usable. */
    #offscreen {
      position: absolute;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 950;
      pointer-events: none;
      overflow: hidden;
    }
    .offbubble {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 2px;
      /* Fixed width (and the HALF_W/HALF_H constants in the script) keeps the
         edge-clamping math exact without measuring the DOM every frame. */
      width: 84px;
      box-sizing: border-box;
      padding: 1px 4px;
      border: 1px solid #3050c0;
      border-radius: 8px;
      background: rgba(255, 255, 255, .85);
      font-size: 10px;
      white-space: nowrap;
    }
    /* Anchor bubbles *inside* the viewport edge they landed on, otherwise half of a
       left/right bubble hangs outside and gets clipped by #offscreen's overflow. */
    .offbubble.lane-left {
      transform: translate(0, -50%);
    }
    .offbubble.lane-right {
      transform: translate(-100%, -50%);
    }
    .offbubble.lane-top {
      transform: translate(-50%, 0);
    }
    .offbubble.lane-bottom {
      transform: translate(-50%, -100%);
    }
    .offbubble .arrow {
      display: inline-block;
      color: #3050c0;
      font-size: 11px;
    }
    .offbubble .label {
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* The "+N more" chip is anchored to the bottom centre; it has no direction. */
    .offbubble.overflow {
      left: 50%;
      transform: translate(-50%, -100%);
      border-style: dashed;
    }
    h1 {
      font-variant: small-caps;
      opacity: 0.5;
      font-size: 25px;
    }
    button {
      height: 25px;
      background-color: white;
      border-radius: 1px;
      cursor: pointer;
    }
    .cy-panzoom {
      position: absolute;
      top: 100px;
      left: 20px;
    }
    .shadow {
      box-shadow: inset 1px 1px 4px #aaa;
      background-color: #eee;
    }
    body.callgraphModeHidden .callgraphMode {
      display: none;
    }
    body.dataflowModeHidden .dataflowMode {
      display: none;
    }
    input[type=number] {
      width: 60px;
      height: 30px;
    }
  </style>
  <script>
    /**
     * Data source. The generator replaces `$DATA` with an inline VisualizerGraphs object (jelly's
     * default) or with `null` while pointing `$DATA_URL` at a raw CallGraph JSON (the format
     * written by `jelly -j`); in the latter case the graph is built here at load time.
     */
    const INLINE_DATA = $DATA;
    const DATA_URL = $DATA_URL;

    /**
     * Builds a callgraph from a raw CallGraph JSON. Mirrors
     * `src/output/visualizer.ts:getVisualizerCallGraph` for the case where the analysis is no
     * longer available (e.g. opening a committed baseline).
     *
     * Relies on these invariants of `src/output/analysisstatereporter.ts:saveCallGraph`:
     *  - `functions` is indexed 0..n-1 and `functionNames[i]` holds its name;
     *  - `moduleNodes[j]` is the `functions` index of the module whose path is `files[j]`;
     *  - `fun2fun` holds both call edges and require edges; `requireEdges` marks the latter.
     */
    function buildCallGraph(cg) {
      const parts = (s) => s.split(":").map(Number); // "<file>:<line>:<col>:<endLine>:<endCol>"
      const at = (s) => { const [, l, c, el, ec] = parts(s); return `${l}:${c}:${el}:${ec}`; };

      const moduleNodes = cg.moduleNodes ?? [];
      const requireEdges = new Set((cg.requireEdges ?? []).map(([a, b]) => `${a},${b}`));
      const isModuleNode = new Set(moduleNodes);
      const functionIndices = Object.keys(cg.functions).map(Number);

      // Package of a module, derived from its path (the JSON has no package information).
      const packageOf = (path) => {
        const m = /(?:^|\/)node_modules\/((?:@[^/]+\/)?[^/]+)/.exec(path);
        return m ? m[1] : "<main>";
      };
      // Module node of a function/module index.
      const moduleOf = (i) => moduleNodes[parts(cg.functions[i])[0]];

      // count incoming call/require edges per function, module and package
      const functionCounts = new Map(), moduleCounts = new Map(), packageCounts = new Map();
      const bump = (map, key) => { const n = (map.get(key) ?? 0) + 1; map.set(key, n); return n; };
      let maxFunction = 1, maxModule = 1, maxPackage = 1;
      for (const [src, dst] of cg.fun2fun) {
        if (!isModuleNode.has(dst)) // only call edges count for functions
          maxFunction = Math.max(maxFunction, bump(functionCounts, dst));
        const mod = isModuleNode.has(dst) ? dst : moduleOf(dst);
        maxModule = Math.max(maxModule, bump(moduleCounts, mod));
        maxPackage = Math.max(maxPackage, bump(packageCounts, packageOf(cg.files[parts(cg.functions[mod])[0]])));
      }

      // reachability: breadth-first from the entry modules over all edges
      const adjacency = new Map();
      for (const [src, dst] of cg.fun2fun) {
        if (!adjacency.has(src)) adjacency.set(src, []);
        adjacency.get(src).push(dst);
      }
      const reachable = new Set();
      const work = [];
      const reach = (i) => { if (!reachable.has(i)) { reachable.add(i); work.push(i); } };
      for (const entry of cg.entries ?? []) {
        const file = cg.files.indexOf(entry);
        if (file >= 0 && moduleNodes[file] !== undefined) reach(moduleNodes[file]);
      }
      while (work.length > 0)
        for (const next of adjacency.get(work.pop()) ?? []) reach(next);
      const reachablePackages = new Set();
      for (const mod of moduleNodes)
        if (reachable.has(mod)) reachablePackages.add(packageOf(cg.files[parts(cg.functions[mod])[0]]));
      const entryPackages = new Set((cg.entries ?? []).map((entry) => packageOf(entry)));

      // emit nodes and edges
      const elements = [];
      const packageIds = new Map(), moduleIds = new Map(), functionIds = new Map();
      let nextId = 1;
      const id = (map, key) => { if (!map.has(key)) map.set(key, nextId++); return map.get(key); };

      const packageNames = [...new Set(moduleNodes.map((mod) => packageOf(cg.files[parts(cg.functions[mod])[0]])))].sort();
      for (const pkg of packageNames) {
        const count = packageCounts.get(pkg) ?? 0;
        elements.push({data: {
          id: id(packageIds, pkg), kind: "package", name: pkg, fullName: pkg,
          callWeight: Math.round(100 * count / maxPackage), callCount: count,
          isEntry: entryPackages.has(pkg) ? "true" : undefined,
          isReachable: reachablePackages.has(pkg) ? "true" : undefined,
        }});
      }
      for (const mod of moduleNodes) {
        const path = cg.files[parts(cg.functions[mod])[0]];
        const pkg = packageOf(path);
        const count = moduleCounts.get(mod) ?? 0;
        elements.push({data: {
          id: id(moduleIds, mod), kind: "module", parent: id(packageIds, pkg), name: path, fullName: `${pkg}:${path}`,
          callWeight: Math.round(100 * count / maxModule), callCount: count,
          isEntry: (cg.entries ?? []).includes(path) ? "true" : undefined,
          isReachable: reachable.has(mod) ? "true" : undefined,
        }});
      }
      for (const i of functionIndices) {
        if (isModuleNode.has(i)) continue;
        const name = (cg.functionNames ?? [])[i] ?? "<anon>";
        const count = functionCounts.get(i) ?? 0;
        elements.push({data: {
          id: id(functionIds, i), kind: "function", parent: id(moduleIds, moduleOf(i)),
          name: `${name} ${at(cg.functions[i])}`, fullName: `${name} @ ${cg.files[parts(cg.functions[i])[0]]}:${at(cg.functions[i])}`,
          callWeight: Math.round(100 * count / maxFunction), callCount: count,
          isReachable: reachable.has(i) ? "true" : undefined,
        }});
      }
      let numEdges = 0;
      for (const [src, dst] of cg.fun2fun) {
        elements.push({data: {
          kind: requireEdges.has(`${src},${dst}`) ? "require" : "call",
          source: id(isModuleNode.has(src) ? moduleIds : functionIds, src),
          target: id(isModuleNode.has(dst) ? moduleIds : functionIds, dst),
        }});
        numEdges++;
      }
      return {
        kind: "callgraph",
        elements,
        info: `Packages: ${packageNames.length}\nModules: ${moduleNodes.length}\nFunctions: ${functionIndices.length - moduleNodes.length}\nEdges: ${numEdges}`,
      };
    }

    /** Resolves the graphs to display, either from the inline data or from the data URL. */
    async function loadGraphs() {
      if (INLINE_DATA)
        return INLINE_DATA;
      const response = await fetch(DATA_URL);
      if (!response.ok)
        throw new Error(`cannot load ${DATA_URL}: HTTP ${response.status}`);
      return {graphs: [buildCallGraph(await response.json())]};
    }

    document.addEventListener('DOMContentLoaded', async () => {
      cytoscape.warnings(false);
      const cy = window.cy = cytoscape({
        container: document.getElementById('cy'),
        layout: null,
        wheelSensitivity: 0.3,
        maxZoom: 3,
        style: [
          {
            selector: 'node',
            style: {
              'min-zoomed-font-size': '3px',
              'background-color': '#aaaaaa'
            }
          },
          {
            selector: 'node.cy-expand-collapse-collapsed-node',
            style: {
              'border-width': '1px',
              'border-style': 'solid',
              'border-color': '#000000'
            }
          },
          {
            selector: 'node.cy-expand-collapse-collapsed-node.callWeight',
            style: {
              'background-color': 'mapData(callWeight, 0, 100, lightgray, purple)'
            }
          },
          {
            selector: 'node.cy-expand-collapse-collapsed-node.tokenWeight',
            style: {
              'background-color': 'mapData(tokenWeight, 0, 100, lightgray, purple)'
            }
          },
          {
            selector: 'node[isEntry]',
            style: {
              'border-width': '3px',
              'border-style': 'solid',
              'border-color': '#000000'
            }
          },
          {
            selector: 'node:selected',
            style: {
              'border-width': '4px',
              'border-style': 'solid',
              'border-color': '#3050c0'
            }
          },
          {
            selector: 'node[isReachable].highlight',
            style: {
              'border-width': '2px',
              'border-style': 'solid',
              'border-color': '#ffff00'
            }
          },
          {
            selector: 'node:selected[isReachable].highlight',
            style: {
              'border-width': '4px',
              'border-color': '#50c050'
            }
          },
          {
            selector: 'node:selected[isEntry]',
            style: {
              'border-width': '5px',
            }
          },
          {
            selector: 'node[isEntry].highlight',
            style: {
              'border-width': '5px',
            }
          },
          {
            selector: 'node[kind="package"]',
            style: {
              'label': 'data(name)',
              'font-size': '10px',
              'shape': 'rectangle'
            }
          },
          {
            selector: 'node[kind="package"].callWeight',
            style: {
              'width': function (node) {
                return (30 + Math.sqrt(node.data('callWeight'))*2) + 'px';
              },
              'height': function (node) {
                return (30 + Math.sqrt(node.data('callWeight'))*2) + 'px';
              }
            }
          },
          {
            selector: 'node[kind="package"].tokenWeight',
            style: {
              'width': function (node) {
                return (30 + Math.sqrt(node.data('tokenWeight'))*2) + 'px';
              },
              'height': function (node) {
                return (30 + Math.sqrt(node.data('tokenWeight'))*2) + 'px';
              }
            }
          },
          {
            selector: 'node[kind="module"]',
            style: {
              'label': 'data(name)',
              'font-size': '8px',
              'shape': 'rectangle'
            }
          },
          {
            selector: 'node[kind="module"].callWeight',
            style: {
              'width': function (node) {
                return (20 + Math.sqrt(node.data('callWeight'))) + 'px';
              },
              'height': function (node) {
                return (20 + Math.sqrt(node.data('callWeight'))) + 'px';
              }
            }
          },
          {
            selector: 'node[kind="module"].tokenWeight',
            style: {
              'width': function (node) {
                return (20 + Math.sqrt(node.data('tokenWeight'))) + 'px';
              },
              'height': function (node) {
                return (20 + Math.sqrt(node.data('tokenWeight'))) + 'px';
              },
              'background-color': 'mapData(tokenWeight, 0, 100, gray, red)'
            }
          },
          {
            selector: 'node[kind="function"]',
            style: {
              'label': 'data(name)',
              'font-size': '6px',
              'shape': 'ellipse'
            }
          },
          {
            selector: 'node[kind="function"].callWeight',
            style: {
              'width': function (node) {
                return (10 + node.data('callWeight')/3) + 'px';
              },
              'height': function (node) {
                return (10 + node.data('callWeight')/3) + 'px';
              },
              'background-color': 'mapData(callWeight, 0, 100, gray, purple)'
            }
          },
          {
            selector: 'node.cy-expand-collapse-collapsed-node',
            style: {
              'shape': 'rectangle',
            },
          },
          {
            selector: ':parent',
            style: {
              'background-opacity': 0.333
            }
          },
          {
            selector: 'node[isSource]',
            style: {
              'background-color': '#aa0000',
              'background-opacity': 0.8
            }
          },
          {
            selector: 'node[isTarget]',
            style: {
              'background-color': '#ff0000',
              'background-opacity': 0.8
            }
          },
          {
            selector: 'node[kind="variable"]',
            style: {
              'shape': 'ellipse',
              'width': '8px',
              'height': '8px',
              'background-color': 'gray'
            }
          },
          {
            selector: 'node[kind="variable"].tokenWeight',
            style: {
              'width': function (node) {
                return (8 + Math.sqrt(node.data('tokenWeight'))/2) + 'px';
              },
              'height': function (node) {
                return (8 + Math.sqrt(node.data('tokenWeight'))/2) + 'px';
              },
              'background-color': 'mapData(tokenWeight, 0, 100, gray, red)'
            }
          },
          {
            // S3e Overview: one synthetic node per module directory (see buildOverviewElements).
            selector: 'node[kind="directory"]',
            style: {
              'label': 'data(label)',
              'font-size': '12px',
              'text-valign': 'center',
              'text-halign': 'center',
              'text-wrap': 'wrap',
              'shape': 'round-rectangle',
              'background-color': '#d7dcff',
              'border-width': '1px',
              'border-color': '#3050c0',
              'width': function (node) {
                return (70 + Math.sqrt(node.data('weight')) * 3) + 'px';
              },
              'height': function (node) {
                return (30 + Math.sqrt(node.data('weight')) * 1.5) + 'px';
              }
            }
          },
          {
            selector: 'edge',
            style: {
              'width': 1,
              'line-color': '#888',
              'target-arrow-color': '#888',
              'target-arrow-shape': 'triangle',
              // cytoscape-elk computes node positions only; ELK's ORTHOGONAL bend
              // points are not fed back into cytoscape, so request right-angled
              // wiring from cytoscape itself (`taxi`).
              'curve-style': 'taxi',
              'taxi-direction': 'horizontal'
            }
          },
          {
            // S3e Overview: aggregated directory -> directory edge (weight = number of
            // original call/require edges it represents).
            selector: 'edge[kind="overview"]',
            style: {
              'width': function (edge) {
                return (1 + Math.log2(edge.data('weight'))) + 'px';
              },
              'line-color': '#8090c0',
              'target-arrow-color': '#8090c0',
              'label': function (edge) {
                return edge.data('weight') > 1 ? String(edge.data('weight')) : '';
              },
              'font-size': '8px',
              'text-valign': 'center',
              'text-halign': 'center',
              'color': '#5060a0'
            }
          },
          {
            selector: 'edge.cy-expand-collapse-collapsed-edge',
            style: {
              'width': function (edge) {
                return (2 + Math.log2(edge.data('collapsedEdges').length)/2) + 'px';
              },
              'curve-style': 'unbundled-bezier'
            }
          },
          {
            selector: 'edge[kind="require"]',
            style: {
              'line-color': '#bbb',
              'target-arrow-color': '#bbb',
            }
          },
          {
            selector: '.hidden',
            css: {
              'display': 'none'
            }
          },
          {
            selector: 'edge[sourceTarget]',
            style: {
              'line-color': '#aa0000',
              'target-arrow-color': '#aa0000',
              'width': '3px'
            }
          },
          {
            selector: 'edge[kind="data"]',
            style: {
              'width': function (edge) {
                return 1 + Math.log2((edge.data('weight') ?? 0) + 1);
              }
            }
          },
          {
            // Edges incident to the selected node(s). `incident-out` leaves the selection,
            // `incident-in` enters it — same ←/→ reading as the graph:func tree view.
            selector: 'edge.incident',
            style: {
              'width': '3px',
              'line-color': '#3050c0',
              'target-arrow-color': '#3050c0'
            }
          },
          {
            selector: 'edge.incident-in',
            style: {
              'line-color': '#c05030',
              'target-arrow-color': '#c05030'
            }
          }
        ]
      });
      cy.panzoom({
        panSpeed: 5,
        panDistance: 15
      });
      // The UMD build auto-registers when the global `cytoscape` exists; call it
      // explicitly too so a load-order change fails loudly instead of silently.
      // (The plugin API is static: `cytoscape.use`, not `cy.use`.)
      if (typeof cytoscapeElk !== 'undefined')
        cytoscape.use(cytoscapeElk);

      cy.on("layoutstart", e => {
        document.getElementById("layout").classList.add("shadow");
      });
      cy.on("layoutstop", e => {
        document.getElementById("layout").classList.remove("shadow");
      });
      // --------------------------------------------------------------------------- A1/A2
      //
      // A1: highlight the edges incident to the selected node(s).
      // A2: for neighbours that are outside the viewport, show a bubble clamped to the
      //     viewport edge with an arrow pointing at the node ("off-screen enemy indicator").
      //
      // Deliberate limits of this draft (see tmp/oh-my-jelly-0928.md §A2):
      //   - 1 hop only; recursing would make the cap below meaningless
      //   - capped at OFFSCREEN_MAX bubbles, the rest is reported as "+N"
      //   - bubbles are not inset around the control panels, they only sit *below* them
      //     in z-order, so an edge bubble can visually overlap a panel
      const OFFSCREEN_MARGIN = 24; // px: a node counts as off-screen once it is this far out
      const OFFSCREEN_MAX = 12;    // px: bubble cap
      const BUBBLE_GAP = 92;       // px: minimum spacing between bubbles on the same edge
      const HALF_W = 44;           // px: half of .offbubble's width (see the CSS)
      const HALF_H = 11;           // px: half of .offbubble's height

      const bubbles = new Map();   // node id -> {el, arrow, label}
      let overflowChip = null;
      let offscreenScheduled = false;

      function refreshIncidentEdges() {
        cy.edges().removeClass('incident incident-in incident-out');
        const sel = cy.$('node:selected');
        if (sel.empty())
          return;
        // `:visible` skips nodes hidden by expand-collapse: they live inside the plugin
        // (not in cy.elements()), and removing/highlighting them is meaningless.
        sel.connectedEdges().filter(':visible').forEach(e => {
          e.addClass('incident');
          e.addClass(e.source().selected() ? 'incident-out' : 'incident-in');
        });
      }

      function offscreenNeighbours() {
        const sel = cy.$('node:selected');
        if (sel.empty())
          return [];
        return sel.connectedEdges().connectedNodes().difference(sel).filter(':visible');
      }

      function bubbleFor(id) {
        let b = bubbles.get(id);
        if (!b) {
          const el = document.createElement('div');
          el.className = 'offbubble';
          const arrow = document.createElement('span');
          arrow.className = 'arrow';
          arrow.textContent = '\u27A4';
          const label = document.createElement('span');
          label.className = 'label';
          el.append(arrow, label);
          b = {el, arrow, label};
          bubbles.set(id, b);
          document.getElementById('offscreen').append(el);
        }
        return b;
      }

      function updateOffscreen() {
        // Early out before touching layout: 'render' fires every frame while panning, and
        // getBoundingClientRect() is not free.
        if (bubbles.size === 0 && !overflowChip && cy.$('node:selected').empty())
          return;
        const box = cy.container().getBoundingClientRect();
        const w = box.width, h = box.height;
        const cx = w / 2, cyc = h / 2;
        const outside = [];
        for (const n of offscreenNeighbours()) {
          const p = n.renderedPosition();
          if (p.x >= OFFSCREEN_MARGIN && p.x <= w - OFFSCREEN_MARGIN &&
              p.y >= OFFSCREEN_MARGIN && p.y <= h - OFFSCREEN_MARGIN)
            continue;
          outside.push({n, p, degree: n.degree()});
        }
        // Stable order (degree desc, then id) so the shown subset does not flicker while panning.
        outside.sort((a, b) => b.degree - a.degree || a.n.id().localeCompare(b.n.id()));
        const shown = outside.slice(0, OFFSCREEN_MAX);
        const placed = [];

        const keep = new Set(shown.map(x => x.n.id()));
        for (const [id, b] of bubbles)
          if (!keep.has(id)) {
            b.el.remove();
            bubbles.delete(id);
          }

        for (const {n, p} of shown) {
          const dx = p.x - cx, dy = p.y - cyc;
          // Ray/box exit point: the smallest fraction along (dx,dy) that leaves the inset box,
          // and which edge that lands on.
          const scaleX = (cx - OFFSCREEN_MARGIN) / Math.max(Math.abs(dx), 1e-6);
          const scaleY = (cyc - OFFSCREEN_MARGIN) / Math.max(Math.abs(dy), 1e-6);
          let lane, along, x, y;
          if (scaleX <= scaleY) {
            lane = dx > 0 ? 'right' : 'left';
            x = dx > 0 ? w - OFFSCREEN_MARGIN : OFFSCREEN_MARGIN;
            y = cyc + dy * scaleX;
            along = y;
          } else {
            lane = dy > 0 ? 'bottom' : 'top';
            y = dy > 0 ? h - OFFSCREEN_MARGIN : OFFSCREEN_MARGIN;
            x = cx + dx * scaleY;
            along = x;
          }
          placed.push({n, dx, dy, lane, along, x, y});
        }

        // Neighbours in similar directions land on the same edge and would pile up, so push
        // them apart along that edge (1-D, order preserving) and then re-centre the run.
        for (const lane of ['left', 'right', 'top', 'bottom']) {
          const list = placed.filter(it => it.lane === lane);
          if (list.length < 2)
            continue;
          const vertical = lane === 'left' || lane === 'right';
          const size = vertical ? h : w;
          // Keep the whole pill inside the edge, not just its anchor point.
          const half = vertical ? HALF_H : HALF_W;
          const lo = OFFSCREEN_MARGIN + half, hi = size - OFFSCREEN_MARGIN - half;
          for (const it of list)
            it.along = Math.min(Math.max(it.along, lo), hi);
          list.sort((a, b) => a.along - b.along);
          // Spread around the original mean with a gap that always fits: shifting the whole
          // run after pushing it apart does not work (the two corrections cancel out when the
          // run is longer than the edge, which is exactly when it matters).
          const gap = Math.min(BUBBLE_GAP, (hi - lo) / Math.max(list.length - 1, 1));
          const mean = list.reduce((sum, it) => sum + it.along, 0) / list.length;
          const start = Math.min(Math.max(mean - gap * (list.length - 1) / 2, lo), hi - gap * (list.length - 1));
          list.forEach((it, i) => {
            it.along = start + gap * i;
          });
        }

        for (const it of placed) {
          const {n, dx, dy, lane, along} = it;
          const b = bubbleFor(n.id());
          b.el.className = `offbubble lane-${lane}`;
          b.el.style.left = `${lane === 'left' || lane === 'right' ? it.x : along}px`;
          b.el.style.top = `${lane === 'top' || lane === 'bottom' ? it.y : along}px`;
          b.arrow.style.transform = `rotate(${Math.atan2(dy, dx) * 180 / Math.PI}deg)`;
          // node.data('name') is "<name> <line>:<col>:<endLine>:<endCol>"; the location is
          // noise in a bubble this small, keep it in the tooltip only.
          const name = n.data('name') ?? '';
          b.label.textContent = name.split(' ')[0];
          b.el.title = n.data('fullName') ?? name;
          b.el.onclick = () => {
            const zoom = cy.zoom();
            const pos = n.position();
            cy.animate({pan: {x: w / 2 - pos.x * zoom, y: h / 2 - pos.y * zoom}, duration: 250});
          };
        }

        const hidden = outside.length - shown.length;
        if (hidden > 0) {
          if (!overflowChip) {
            overflowChip = document.createElement('div');
            overflowChip.className = 'offbubble overflow';
            document.getElementById('offscreen').append(overflowChip);
          }
          overflowChip.style.top = `${h - OFFSCREEN_MARGIN}px`;
          overflowChip.textContent = `+${hidden} more off-screen`;
          overflowChip.title = `只有扇入/扇出最大的 ${OFFSCREEN_MAX} 个邻居画了气泡；其余 ${hidden} 个未显示`;
        } else if (overflowChip) {
          overflowChip.remove();
          overflowChip = null;
        }
      }

      function scheduleOffscreen() {
        if (offscreenScheduled)
          return;
        offscreenScheduled = true;
        requestAnimationFrame(() => {
          offscreenScheduled = false;
          updateOffscreen();
        });
      }

      cy.on('select', e => {
        document.getElementById("msg").textContent = e.target?.data()?.fullName ?? '';
        refreshIncidentEdges();
        scheduleOffscreen();
      });
      cy.on('unselect', () => {
        document.getElementById("msg").textContent = '';
        refreshIncidentEdges();
        scheduleOffscreen();
      });
      // Pan/zoom/layout animation all go through 'render'; rAF-throttled, so this is cheap.
      cy.on('render', scheduleOffscreen);

      // ELK `layered` = Sugiyama layering (cytoscape-cola was force-directed and
      // produced an unreadable spider web for the call DAG). `direction: RIGHT`
      // matches the call direction (caller -> callee), `edgeRouting: ORTHOGONAL`
      // gives right-angled taxi-like wiring.
      // INCLUDE_CHILDREN: call edges cross package/module boundaries; ELK Layered
      // requires it to route edges whose endpoints live on different hierarchy
      // levels (otherwise UnsupportedGraphException).
      const ELK_OPTIONS = {
        algorithm: 'layered',
        'elk.hierarchyHandling': 'INCLUDE_CHILDREN',
        'elk.direction': 'RIGHT',
        'elk.edgeRouting': 'ORTHOGONAL',
        'elk.layered.crossingMinimization.strategy': 'LAYER_SWEEP',
        'elk.layered.nodePlacement.strategy': 'BRANDES_KOEPF',
        'elk.layered.considerModelOrder.strategy': 'NODES_AND_EDGES',
        'elk.spacing.nodeNode': '24',
        'elk.layered.spacing.nodeNodeBetweenLayers': '60',
        'elk.padding': '[top=20,left=20,bottom=20,right=20]',
      };
      // A non-animated ELK layout over an arbitrary collection. cytoscape-elk resolves
      // asynchronously, so completion must be awaited via `layout.one('layoutstop')`
      // before post-processing the resulting coordinates (incremental expand).
      const layoutCollection = (eles) => eles.layout({
        name: 'elk',
        fit: false,
        animate: false,
        padding: 20,
        nodeDimensionsIncludeLabels: true,
        elk: { ...ELK_OPTIONS },
      });

      let layout;
      // Bumped whenever a layout is superseded, so async ELK callbacks from an
      // abandoned incremental expand cannot reposition the graph behind a newer action.
      let layoutToken = 0;
      const stopLayout = () => {
        layoutToken++;
        layout?.stop();
      };
      function newLayout(fit = false) {
        layout = cy.layout({
          name: 'elk',
          fit,
          animate: true,
          padding: 20,
          nodeDimensionsIncludeLabels: true,
          elk: { ...ELK_OPTIONS },
        });

        layout.start();
      }

      let removed;
      // Synthesized elements of the Overview view (directory nodes + aggregated
      // edges). Kept out of `removed` so the two views cannot resurrect each other:
      // `hide()` drops the overview first, then restores `removed`.
      let overview;
      // Depth (path segments) the current overview was built with, needed by the
      // drill-down to regroup exactly the same directories.
      let overviewDepthUsed = 3;

      // Puts everything Overview / Focus / Remove took out back into the graph. Shared
      // by `hide()` and the Overview entry point so there is exactly one restore path.
      function restoreRemoved() {
        if (!removed)
          return;
        removed.filter("node").restore();
        removed.filter("edge").forEach(e => {
          if (e.source().inside() && e.target().inside())
            e.restore();
        });
        removed = removed.filter(":removed");
      }

      function clearOverview() {
        if (!overview)
          return;
        overview.remove();
        overview = undefined;
      }

      function hide() {
        stopLayout();
        clearOverview();
        restoreRemoved();
        const threshold = document.getElementById("threshold").value;
        const count = graph.kind === "callgraph" ? "callCount" : graph.kind === "dataflow" ? "tokenCount" : undefined;
        const queries = [];
        if (count && threshold > 0)
          queries.push(`node[${count} < ${threshold}]`);
        if (document.getElementById("hideUnreachable").checked)
          queries.push("node[!isReachable]");
        if (queries.length > 0) {
          const nodes = cy.elements(queries.join(","));
          ec.expandAllEdges();
          ec.collapseRecursively(nodes);
          ec.collapseAllEdges();
          const r = nodes.remove();
          removed = removed ? removed.union(r) : r;
        }
      }

      const ec = cy.expandCollapse({
        fisheye: false,
        randomize: false,
        animate: true,
        undoable: false,
        cueEnabled: false,
        allowNestedEdgeCollapse: false,
        groupEdgesOfSameTypeOnCollapse: true
      });
      cy.on("expandcollapse.afterexpand", node => {
        cy.batch(() => {
          const desc = cy.nodes(node.target).descendants();
          if (document.getElementById("showCallDensity").checked)
            desc.addClass("callWeight");
          else
            desc.removeClass("callWeight");
          if (document.getElementById("showValueDensity").checked)
            desc.addClass("tokenWeight");
          else
            desc.removeClass("tokenWeight");
          if (document.getElementById("highlightReachable").checked)
            desc.addClass("highlight");
          else
            desc.removeClass("highlight");
        });
      });

      /**
       * Incremental expand: reveal `es` without re-laying out the whole graph.
       *
       * 1. remember where every currently visible node is;
       * 2. `ec.expand(...)`;
       * 3. pin every pre-existing node back to its remembered coordinates;
       * 4. lay out only the freshly revealed subtree (ELK layered, honouring the
       *    module -> function hierarchy) and translate that island next to the
       *    untouched graph so it cannot overlap it.
       *
       * Returns true when something was actually revealed.
       */
      function expandIncremental(es) {
        const before = new Map();
        cy.nodes().forEach(n => before.set(n.id(), { x: n.position().x, y: n.position().y }));

        ec.expandAllEdges();
        ec.expand(es.union(es.children(':visible')));
        ec.collapseAllEdges();
        showVulnerabilities();
        hide();

        // Every node the expansion (or a just-undone hide) brought into the graph.
        const revealed = cy.nodes().filter(n => !before.has(n.id()));
        if (revealed.size === 0)
          return false; // already expanded: leave the graph exactly as it is
        const subtree = es.union(es.descendants()).union(revealed);

        // Old nodes keep their exact coordinates (a compound ancestor still
        // recomputes its own bounding box from its children, which is expected).
        const old = cy.nodes().difference(subtree);
        cy.batch(() => {
          old.forEach(n => {
            const p = before.get(n.id());
            if (p) n.position(p);
          });
        });

        // Lay out only the island: the revealed subtree plus its internal edges.
        // ELK requires every laid-out node's parent to be part of the collection
        // (its builder crashes on a child whose parent is missing), so bring the
        // ancestor containers along even though only the subtree is repositioned.
        const internalEdges = cy.edges().filter(e => subtree.contains(e.source()) && subtree.contains(e.target()));
        const internal = subtree.union(subtree.ancestors()).union(internalEdges);

        // Vertical anchor: the (old) centre of the node(s) that were expanded.
        let anchorY = 0, anchorCount = 0;
        es.forEach(node => {
          const p = before.get(node.id());
          if (p) { anchorY += p.y; anchorCount++; }
        });

        // cytoscape-elk resolves asynchronously, so the island can only be parked
        // once `layoutstop` fires (otherwise we would move stale coordinates).
        const token = layoutToken;
        layout = layoutCollection(internal);
        layout.one('layoutstop', () => {
          if (token !== layoutToken)
            return; // superseded by a newer action
          const leaves = old.filter(n => n.children().length === 0);
          const anchor = leaves.size() > 0 ? leaves.boundingBox() : null;
          if (anchorCount === 0 && anchor) anchorY = anchor.y1;
          const island = subtree.boundingBox();
          const gap = 120;
          subtree.shift({
            x: (anchor ? anchor.x2 + gap : 0) - island.x1,
            y: anchorY - (island.y1 + island.y2) / 2,
          });
          // If the island landed outside the viewport, pan/zoom onto it (this only
          // touches the viewport, never the model coordinates pinned above).
          const view = cy.extent();
          const placed = subtree.boundingBox();
          if (placed.x1 < view.x1 || placed.y1 < view.y1 || placed.x2 > view.x2 || placed.y2 > view.y2)
            cy.animate({ fit: { eles: subtree, padding: 60 }, duration: 400 });
        });
        layout.run();
        return true;
      }

      /**
       * Focus (ego subgraph): keep only the selected node(s) plus everything within
       * `depth` hops along *visible* call edges, drop the rest, then re-fit the viewport.
       *
       * The dropped elements go into the same `removed` collection that `hide()` uses, so
       * the existing `Expand all` / `Collapse all` / `Layout` buttons (which now all funnel
       * through `hide()`) bring the whole graph back instead of inventing a second undo
       * mechanism.
       *
       * Compound containers must survive: `remove()` cascades into descendants, so dropping
       * a kept node's module/package ancestor would silently delete the kept node too (and a
       * later `restore()` would reject the orphaned child). Hence `reached ∪ ancestors`.
       * A selected *compound* seeds the BFS with its descendants, so focusing a module keeps
       * the module's functions rather than just the empty container.
       */
      function focusSelected(depthOverride) {
        const msg = document.getElementById("msg");
        const selected = cy.$("node:selected");
        if (selected.size() === 0) {
          msg.textContent = "Focus: select a node first (nothing is selected).";
          return;
        }
        const rawDepth = depthOverride ?? Number(document.getElementById("focusDepth").value);
        const depth = Number.isFinite(rawDepth) ? Math.max(0, Math.floor(rawDepth)) : 2;

        stopLayout();
        const collapsed = cy.$("node.cy-expand-collapse-collapsed-node");
        // Collapsed edges are aggregates and carry no `kind`; materialise them so the BFS
        // sees the real call edges. Compounds themselves stay collapsed ("visible" graph).
        ec.expandAllEdges();

        // Bidirectional adjacency over visible call edges.
        const adjacency = new Map();
        cy.edges('edge[kind="call"]:visible').forEach(edge => {
          const s = edge.source().id();
          const t = edge.target().id();
          if (!adjacency.has(s)) adjacency.set(s, []);
          if (!adjacency.has(t)) adjacency.set(t, []);
          adjacency.get(s).push(t);
          adjacency.get(t).push(s);
        });

        const reached = new Set(selected.union(selected.descendants()).map(n => n.id()));
        let frontier = [...reached];
        for (let hop = 0; hop < depth && frontier.length > 0; hop++) {
          const next = [];
          for (const id of frontier)
            for (const nb of adjacency.get(id) ?? [])
              if (!reached.has(nb)) {
                reached.add(nb);
                next.push(nb);
              }
          frontier = next;
        }

        // Keep the reached nodes plus every compound ancestor (container).
        let keep = cy.collection();
        reached.forEach(id => {
          const node = cy.getElementById(id);
          if (node.nonempty())
            keep = keep.union(node).union(node.ancestors());
        });
        // Edges are only kept when both endpoints survive.
        keep = keep.union(cy.edges().filter(e => keep.contains(e.source()) && keep.contains(e.target())));

        if (!removeOtherThan(keep))
          return; // whole visible graph is already within N hops: nothing to trim
        ec.collapseRecursively(collapsed.intersection(keep));
        ec.collapseAllEdges();
        newLayout(true); // fit=true is the point: the trimmed subgraph fills the viewport
      }

      /** Moves everything outside `keep` into the shared `removed` collection. */
      function removeOtherThan(keep) {
        const drop = cy.elements().difference(keep);
        if (drop.empty())
          return false;
        const r = drop.remove();
        removed = removed ? removed.union(r) : r;
        return true;
      }

      // ---- Overview (S3e): directory-level aggregation -------------------------
      //
      // The full call graph is a per-function spider web (1885 nodes, ~40k edge
      // crossings). Overview replaces it with one synthetic node per module
      // *directory* and one aggregated edge per ordered directory pair, i.e. a
      // ~17-node "module map" that answers "which subsystems talk to which".
      //
      // Why no compound layer: the existing hierarchy is package > module > function,
      // and a directory cuts across it (it is not a fifth well-defined level; a module
      // has exactly one directory, but a directory can hold modules from several
      // packages, and none of the existing parents means "directory"). Synthesizing
      // plain nodes keeps `cytoscape-expand-collapse` — whose whole model is that
      // three-level compound tree — untouched. Erasing the originals into the shared
      // `removed` collection and restoring them through `hide()` is the entire
      // integration; the alternative (temporary compound parents) would have to fake
      // package/module ancestry and fight expand-collapse.

      // File path behind a node, used to derive its directory. Callgraph function
      // nodes carry it in `fullName` ("<name> @ <path>:<line>:<col>:<endLine>:<endCol>");
      // module nodes carry it directly in `name`. Package/variable nodes have no path.
      function nodeFilePath(node) {
        if (node.data("kind") === "module")
          return node.data("name") ?? "";
        const full = node.data("fullName") ?? "";
        const at = full.lastIndexOf(" @ ");
        return at < 0 ? "" : full.slice(at + 3).replace(/:\d+:\d+:\d+:\d+$/, "");
      }

      // Directory key = the first `depth` segments of the node's parent directory.
      // `src/lib/bindings/storage/x.ts` -> `src/lib/bindings` (depth 3);
      // `src/routes/+page.svelte` -> `src/routes`. Configurable via #overviewDepth
      // (2 = only src/lib vs src/routes, 4 = one more level, e.g. components/workspace).
      function directoryOfPath(path, depth) {
        const dir = path.split("/").slice(0, -1);
        return dir.length === 0 ? "<root>" : dir.slice(0, depth).join("/");
      }

      function buildOverviewElements(depth) {
        // 1. Bucket every original node (module + function) by directory.
        const dirs = new Map(); // dir -> {moduleCount, functionCount, callCount, internal}
        const dirOf = new Map(); // node id -> dir
        cy.nodes().filter(n => n.data("kind") === "module" || n.data("kind") === "function").forEach(n => {
          const dir = directoryOfPath(nodeFilePath(n), depth);
          dirOf.set(n.id(), dir);
          const d = dirs.get(dir) ?? { moduleCount: 0, functionCount: 0, callCount: 0, internal: 0 };
          if (n.data("kind") === "module") d.moduleCount++;
          else d.functionCount++;
          d.callCount += n.data("callCount") ?? 0;
          dirs.set(dir, d);
        });

        // 2. Aggregate every original edge onto its directory pair. Edges that stay
        //    inside one directory become a self-loop: count them on the node instead
        //    of drawing a loop (a loop on every one of 17 nodes is pure noise).
        const agg = new Map();
        cy.edges().not(".cy-expand-collapse-collapsed-edge").forEach(e => {
          const s = dirOf.get(e.source().id());
          const t = dirOf.get(e.target().id());
          if (s === undefined || t === undefined)
            return;
          if (s === t) {
            dirs.get(s).internal++;
            return;
          }
          const key = `${s}\u0000${t}`;
          const a = agg.get(key) ?? { s, t, weight: 0, calls: 0, requires: 0 };
          a.weight++;
          if (e.data("kind") === "require") a.requires++;
          else a.calls++;
          agg.set(key, a);
        });

        // 3. Emit nodes and aggregated edges.
        const maxWeight = Math.max(1, ...[...dirs.values()].map(d => d.moduleCount + d.functionCount));
        const elements = [];
        let nextId = 1;
        const ids = new Map();
        const nodeId = (dir) => {
          if (!ids.has(dir)) ids.set(dir, `overview-node-${nextId++}`);
          return ids.get(dir);
        };
        for (const [dir, d] of dirs) {
          const short = dir.startsWith("src/") ? dir.slice(4) : dir;
          elements.push({ data: {
            id: nodeId(dir), kind: "directory", name: short,
            label: `${short}\n${d.moduleCount} mod \u00b7 ${d.functionCount} fn`,
            fullName: dir, moduleCount: d.moduleCount, functionCount: d.functionCount,
            weight: d.moduleCount + d.functionCount,
            callWeight: Math.round(100 * d.callCount / maxWeight),
            internalEdges: d.internal,
          }});
        }
        for (const a of agg.values())
          elements.push({ data: {
            id: `overview-edge-${nextId++}`, kind: "overview",
            source: nodeId(a.s), target: nodeId(a.t),
            weight: a.weight, calls: a.calls, requires: a.requires,
          }});
        return elements;
      }

      /**
       * Overview: replace the visible graph by its directory-level aggregation.
       *
       * Restores whatever Focus/Remove had dropped first (so the aggregation always
       * sees the whole graph), moves every original element into the same `removed`
       * collection the other buttons use, then adds the synthetic nodes/edges. Any
       * later `hide()` (Layout / Collapse all / Expand all / threshold) clears the
       * overview and restores the originals, so this is never a dead end.
       */
      function showOverview() {
        stopLayout();
        clearOverview();
        restoreRemoved();
        // Materialise every original node/edge first. Collapsed descendants are held
        // inside cytoscape-expand-collapse (not in `cy.elements()`); removing a collapsed
        // parent would drop them without ever putting them in `removed`, so recovery
        // would come back short. Expanding also unwraps bundled edges for aggregation.
        ec.expandAll();
        overviewDepthUsed = Math.max(1, Math.floor(Number(document.getElementById("overviewDepth").value) || 3));
        const elements = buildOverviewElements(overviewDepthUsed);
        const originals = cy.elements();
        const r = originals.remove();
        removed = removed ? removed.union(r) : r;
        overview = cy.add(elements);
        newLayout(true);
      }

      /**
       * Drill-down: a directory node selects that directory's member modules and
       * hands them to Focus with depth 0, so the view is exactly the directory's own
       * subtree (modules + their functions), with no outside hops. Reusing Focus is
       * deliberate: `expandIncremental` funnels through `hide()`, which restores the
       * whole graph, so a collapsed-modules drill-down could not be expanded further
       * anyway (same pre-existing semantics as Focus).
       */
      function focusDirectory(dir) {
        clearOverview();
        restoreRemoved();
        const members = cy.nodes().filter(n => n.data("kind") === "module" && directoryOfPath(nodeFilePath(n), overviewDepthUsed) === dir);
        if (members.size() === 0)
          return;
        cy.$(":selected").unselect();
        members.select();
        focusSelected(0);
      }

      document.getElementById("collapseAll").addEventListener("click", () => {
        stopLayout();
        hide();
        ec.expandAllEdges();
        ec.collapseAll();
        ec.collapseAllEdges();
        showVulnerabilities();
        newLayout();
      });
      document.getElementById("collapseSelected").addEventListener("click", () => {
        stopLayout();
        const ns = cy.$(":selected:compound:visible");
        if (ns.size() > 0) {
          ec.expandAllEdges();
          ec.collapseRecursively(ns);
          ec.collapseAllEdges();
          showVulnerabilities();
          newLayout();
        }
      });
      document.getElementById("expandSelected").addEventListener("click", () => {
        stopLayout();
        const es = cy.$(":selected:visible.cy-expand-collapse-collapsed-node,:selected:visible:compound");
        if (es.size() > 0)
          expandIncremental(es);
      });
      document.getElementById("expandAllPackages").addEventListener("click", () => {
        stopLayout();
        expandIncremental(cy.$('node[kind="package"]:visible.cy-expand-collapse-collapsed-node'));
      });
      document.getElementById("expandAll").addEventListener("click", () => {
        stopLayout();
        ec.expandAllEdges();
        ec.expandRecursively(cy.nodes(":visible"));
        hide();
        newLayout();
      });
      document.getElementById("showPredecessors").addEventListener("click", () => {
        const es = cy.$("node:selected");
        if (es.size() > 0) {
          stopLayout();
          const collapsed = cy.$("node.cy-expand-collapse-collapsed-node");
          ec.expandAllEdges();
          ec.expandAll();
          const sources = es.union(es.descendants());
          const pred = sources.predecessors().union(sources);
          const keep = pred.union(pred.ancestors())
          cy.nodes().difference(keep).remove();
          ec.collapseRecursively(collapsed.intersection(keep));
          ec.collapseAllEdges();
          hide();
          newLayout();
        }
      });
      document.getElementById("focusSelected").addEventListener("click", () => {
        focusSelected();
      });
      document.getElementById("overview").addEventListener("click", () => {
        showOverview();
      });
      cy.on("tap", 'node[kind="directory"]', e => {
        focusDirectory(e.target.data("fullName"));
      });
      document.getElementById("removeSelected").addEventListener("click", () => {
        const es = cy.$(":selected");
        if (es.size() > 0) {
          stopLayout();
          ec.expandAllEdges();
          cy.$(":selected").remove();
          ec.collapseAllEdges();
          hide();
          newLayout();
        }
      });
      document.getElementById("removeNonSelected").addEventListener("click", () => {
        const es = cy.$(":selected");
        if (es.size() > 0) {
          stopLayout();
          ec.expandAllEdges();
          cy.nodes().difference(es.union(es.descendants()).union(es.ancestors())).remove();
          ec.collapseAllEdges();
          removed = undefined;
          hide();
          newLayout();
        }
      });
      document.getElementById("layout").addEventListener("click", () => {
        // `hide()` restores anything removed via the `removed` collection (e.g. a Focus
        // subgraph) before re-applying the threshold/unreachable filters.
        if (document.getElementById("layout").classList.contains("shadow"))
          return;
        hide();
        newLayout();
      });
      document.getElementById("hideUnreachable").addEventListener("change", () => {
        stopLayout();
        hide();
        newLayout();
      });
      document.getElementById("threshold").addEventListener("change", () => {
        stopLayout();
        hide();
        newLayout();
      });
      document.getElementById("threshold").addEventListener("focus", e => {
        e.target.select();
      });
      document.getElementById("highlightReachable").addEventListener("change", () => {
        stopLayout();
        if (document.getElementById("highlightReachable").checked)
          cy.nodes().addClass("highlight");
        else
          cy.nodes().removeClass("highlight");
        newLayout();
      });
      document.getElementById("showCallDensity").addEventListener("change", () => {
        stopLayout();
        if (document.getElementById("showCallDensity").checked)
          cy.nodes().addClass("callWeight");
        else
          cy.nodes().removeClass("callWeight");
        newLayout();
      });
      document.getElementById("showValueDensity").addEventListener("change", () => {
        stopLayout();
        if (document.getElementById("showValueDensity").checked)
          cy.nodes().addClass("tokenWeight");
        else
          cy.nodes().removeClass("tokenWeight");
        newLayout();
      });

      const data = await loadGraphs();
      let graph;

      function showVulnerabilities() {
        if (!graph.vulnerabilities)
          return;

        stopLayout();
        const vulnerabilityTitle = document.getElementById("vulnerabilities").value;
        const e = document.getElementsByName("vulnerabilityLevel");
        let level = "package";
        for (let i = 0; i < e.length; i++)
          if (e[i].checked) {
            level = e[i].value;
            break;
          }
        const sources = new Set(), targets = new Set();
        for (const v of graph.vulnerabilities)
          if (v.title === vulnerabilityTitle) {
            for (const s of v[level].sources)
              sources.add(String(s));
            for (const s of v[level].targets)
              targets.add(String(s));
          }
        function has(collection, node) {
          return collection.has(node.data("id")) || (ec.isExpandable(node) && ec.getCollapsedChildrenRecursively(node).some(n => collection.has(n.data("id"))));
        }
        cy.batch(() => {
          cy.nodes().forEach(node => {
            node.removeData("isSource isTarget");
            if (has(sources, node))
              node.data("isSource", true);
            if (has(targets, node))
              node.data("isTarget", true);
          });
          cy.edges().forEach(edge => {
            edge.removeData("sourceTarget");
            const source = edge.source();
            const target = edge.target();
            if (has(sources, source) && (has(targets, target) || has(sources, target)))
              edge.data("sourceTarget", true);
          });
         cy.elements().removeClass("workaround");
       });
      }
      document.getElementById("vulnerabilities").addEventListener("change", showVulnerabilities);
      document.getElementById("vulnerabilityLevel").addEventListener("change", showVulnerabilities);

      function setGraph(i) {
        stopLayout();
        removed = undefined;
        overview = undefined;
        cy.elements().remove();
        graph = data.graphs[i];
        cy.add(structuredClone(graph.elements));
        ec.collapseAll();
        ec.collapseAllEdges();
        scheduleOffscreen();
        if (graph.kind === "callgraph")
          document.body.classList.remove("callgraphModeHidden");
        if (graph.kind === "dataflow")
          document.body.classList.remove("dataflowModeHidden");
        document.getElementById("showValueDensity").checked = false;
        if (graph.info)
          document.getElementById("info").innerText = graph.info;
        document.getElementById("threshold").value = 0;
        if (graph.vulnerabilities) {
          const vulnerabilities = document.getElementById("vulnerabilities");
          const vulnerabilityLevel = document.getElementById("vulnerabilityLevel");
          vulnerabilities.hidden = false;
          vulnerabilityLevel.hidden = false;
          for (let i = 0; i < graph.vulnerabilities.length; i++) {
            const opt = document.createElement("option");
            opt.value = opt.innerText = graph.vulnerabilities[i].title;
            vulnerabilities.appendChild(opt);
          }
          showVulnerabilities();
        }
        newLayout(true);
      }

      if (data.graphs.length >= 1) {
        setGraph(0);
        if (data.graphs.length > 1) {
          const dataset = document.getElementById('dataset');
          dataset.hidden = false;
          for (let i = 0; i < data.graphs.length; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.innerText = data.graphs[i].title ?? "";
            dataset.appendChild(opt);
          }
          document.getElementById("dataset").addEventListener("change", e => {
            setGraph(e.target.value);
          });
        }
      }
    });
  </script>
</head>
<body class="callgraphModeHidden dataflowModeHidden">
<header>
<h1>Jelly visualizer</h1>
<div id="info"></div>
<div id="control">
<div class="group">
<button id="collapseAll">Collapse all</button>
<button id="collapseSelected">Collapse selected</button>
<button id="expandSelected">Expand selected</button>
<span class="callgraphMode"><button id="expandAllPackages">Expand all packages</button></span>
<button id="expandAll">Expand all</button>
</div>
<br/>
<div class="group">
<button id="showPredecessors">Show predecessors</button>
<button id="removeSelected">Remove selected</button>
<button id="removeNonSelected">Remove non-selected</button>
</div>
<br/>
<div class="group">
<button id="focusSelected">Focus</button>
<label for="focusDepth"> Depth: </label><input type="number" id="focusDepth" value="2" min="0">
</div>
<br/>
<div class="group">
<span class="callgraphMode">
<button id="overview">Overview</button>
<label for="overviewDepth"> Depth: </label><input type="number" id="overviewDepth" value="3" min="1">
</span>
</div>
<br/>
<div class="group">
<button id="layout">Layout</button>
</div>
<br/>
<div class="group">
<span class="callgraphMode">
<input type="checkbox" id="showCallDensity"><label for="showCallDensity"> Show call density</label>
<br/>
<input type="checkbox" id="highlightReachable"><label for="highlightReachable"> Highlight reachable</label>
<br/>
<input type="checkbox" id="hideUnreachable"><label for="hideUnreachable"> Hide unreachable</label>
</span>
<span class="dataflowMode">
<input type="checkbox" id="showValueDensity"><label for="showValueDensity"> Show value density</label>
</span>
</div>
<span id="fields">
<br/>
<label for="threshold">Threshold: </label><input type="number" id="threshold" value="0" min="0">
<br/>
</span>
<div class="group">
<span id="vulnerabilityLevel" hidden>
Vulnerabilities:<br/>
<select id="vulnerabilities" hidden><option></option></select>
<br/>
<input type="radio" name="vulnerabilityLevel" id="vulnerabilityLevelPackage" value="package" checked><label for="vulnerabilityLevelPackage">Package dependency</label>
<br/>
<input type="radio" name="vulnerabilityLevel" id="vulnerabilityLevelModule" value="module"><label for="vulnerabilityLevelModule">Module dependency</label>
<br/>
<input type="radio" name="vulnerabilityLevel" id="vulnerabilityLevelFunction" value="function"><label for="vulnerabilityLevelFunction">Function reachability</label>
</span>
</div>
</div>
<select id="dataset" hidden></select>
<div id="msg"></div>
</header>
<div id="cy"></div>
<div id="offscreen"></div>
</body>
</html>
